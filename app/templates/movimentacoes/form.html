<!-- templates/movimentacoes/form.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Movimentação — AAPM SENAI</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Container do Fundo Animado */
        .cubes-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0; /* Fica no fundo */
            margin: 0;
            padding: 0;
        }

        /* Estilo base de cada cubo */
        .cubes-bg li {
            position: absolute;
            list-style: none;
            display: block;
            width: 20px;
            height: 20px;
            background: rgba(220, 38, 38, 0.12); /* Vermelho translúcido */
            border: 1px solid rgba(220, 38, 38, 0.25);
            border-radius: 12px; /* Cantos arredondados */
            bottom: -150px;
            animation: moveCubes 22s infinite ease-in-out;
        }

        /* Animação CSS: Subindo, girando e descendo */
        @keyframes moveCubes {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            50% {
                transform: translateY(-50vh) rotate(180deg);
            }
            70% {
                transform: translateY(-35vh) rotate(240deg);
            }
            100% {
                transform: translateY(-105vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Distribuição dos 16 cubos com posições e tempos variados */
        .cubes-bg li:nth-child(1)  { left: 25%; width: 80px; height: 80px; animation-delay: -2s;  animation-duration: 26s; }
        .cubes-bg li:nth-child(2)  { left: 10%; width: 30px; height: 30px; animation-delay: -7s;  animation-duration: 20s; }
        .cubes-bg li:nth-child(3)  { left: 70%; width: 45px; height: 45px; animation-delay: -12s; animation-duration: 22s; }
        .cubes-bg li:nth-child(4)  { left: 40%; width: 60px; height: 60px; animation-delay: -5s;  animation-duration: 30s; }
        .cubes-bg li:nth-child(5)  { left: 65%; width: 25px; height: 25px; animation-delay: -15s; animation-duration: 18s; }
        .cubes-bg li:nth-child(6)  { left: 85%; width: 90px; height: 90px; animation-delay: -8s;  animation-duration: 28s; }
        .cubes-bg li:nth-child(7)  { left: 55%; width: 50px; height: 50px; animation-delay: -18s; animation-duration: 24s; }
        .cubes-bg li:nth-child(8)  { left: 15%; width: 20px; height: 20px; animation-delay: -3s;  animation-duration: 21s; }
        .cubes-bg li:nth-child(9)  { left: 3%;  width: 40px; height: 40px; animation-delay: -10s; animation-duration: 32s; }
        .cubes-bg li:nth-child(10) { left: 92%; width: 70px; height: 70px; animation-delay: -14s; animation-duration: 25s; }
        .cubes-bg li:nth-child(11) { left: 32%; width: 35px; height: 35px; animation-delay: -9s;  animation-duration: 23s; }
        .cubes-bg li:nth-child(12) { left: 48%; width: 75px; height: 75px; animation-delay: -16s; animation-duration: 27s; }
        .cubes-bg li:nth-child(13) { left: 78%; width: 20px; height: 20px; animation-delay: -4s;  animation-duration: 19s; }
        .cubes-bg li:nth-child(14) { left: 20%; width: 55px; height: 55px; animation-delay: -11s; animation-duration: 29s; }
        .cubes-bg li:nth-child(15) { left: 80%; width: 40px; height: 40px; animation-delay: -1s;  animation-duration: 21s; }
        .cubes-bg li:nth-child(16) { left: 60%; width: 30px; height: 30px; animation-delay: -13s; animation-duration: 25s; }
    </style>
</head>
<body class="bg-red-50/40 min-h-screen flex flex-col items-center justify-center p-4 font-sans text-slate-800 relative">

    <!-- Fundo Animado com 16 Cubos -->
    <ul class="cubes-bg">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>

    <!-- Conteúdo Principal / Card de Formulário -->
    <main class="w-full max-w-lg bg-white/90 backdrop-blur-md rounded-2xl shadow-xl border border-red-100/80 p-8 space-y-6 z-10 my-8">
        
        <!-- Cabeçalho -->
        <div class="text-center space-y-2">
            <div class="px-3.5 h-12 bg-red-600 text-white font-bold text-lg rounded-2xl shadow-md mb-1 inline-flex items-center justify-center tracking-wider transform transition-transform duration-300 hover:scale-105">
                AAPM
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Registrar movimentação</h1>
            <p class="text-sm text-slate-500">Cadastre a entrada ou saída de itens do estoque</p>
        </div>

        <!-- Mensagem de Erro -->
        {% if erro %}
            <div class="p-3.5 bg-red-50 border border-red-200 text-red-700 text-sm font-medium rounded-xl text-center">
                {{ erro }}
            </div>
        {% endif %}

        <!-- Formulário -->
        <form action="/movimentacoes/nova" method="post" class="space-y-4">

            <!-- Produto -->
            <div>
                <label for="select-produto" class="block text-sm font-semibold text-slate-700 mb-1">Produto</label>
                <select name="produto_id" required id="select-produto"
                        class="w-full px-4 py-2.5 bg-slate-50/80 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-600 transition-all text-sm">
                    <option value="">Selecione...</option>
                    {% for p in produtos %}
                        <option value="{{ p.id }}"
                                data-estoque="{{ p.estoque_atual }}"
                                data-preco="{{ p.preco }}"
                            {{ 'selected' if produto_id == p.id else '' }}>
                            {{ p.nome }} — estoque: {{ p.estoque_atual }}
                        </option>
                    {% endfor %}
                </select>

                <!-- Informação do Estoque -->
                <div id="info-estoque" class="hidden mt-2 p-2.5 bg-slate-100/80 rounded-lg text-xs text-slate-600 flex justify-between items-center">
                    <span>Estoque atual disponível:</span>
                    <strong id="valor-estoque" class="text-sm font-bold text-slate-900">0</strong>
                </div>
            </div>

            <!-- Tipo -->
            <div>
                <label for="select-tipo" class="block text-sm font-semibold text-slate-700 mb-1">Tipo</label>
                <select name="tipo" required id="select-tipo"
                        class="w-full px-4 py-2.5 bg-slate-50/80 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-600 transition-all text-sm">
                    <option value="">Selecione...</option>
                    {% for t in tipos %}
                        <option value="{{ t.value }}">
                            {{ "▲ Entrada" if t.value == 'entrada' else "▼ Saída" }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Quantidade e Preço em Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="input-quantidade" class="block text-sm font-semibold text-slate-700 mb-1">Quantidade</label>
                    <input type="number"
                           name="quantidade"
                           min="1"
                           required
                           id="input-quantidade"
                           placeholder="0"
                           class="w-full px-4 py-2.5 bg-slate-50/80 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-600 transition-all text-sm">
                </div>

                <div>
                    <label for="input-preco" class="block text-sm font-semibold text-slate-700 mb-1">Preço unitário (R$)</label>
                    <input type="number"
                           name="preco_unitario"
                           step="0.01"
                           min="0"
                           required
                           id="input-preco"
                           placeholder="0.00"
                           class="w-full px-4 py-2.5 bg-slate-50/80 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-600 transition-all text-sm">
                </div>
            </div>

            <!-- Subtotal -->
            <div id="info-subtotal" class="hidden p-3 bg-red-50 border border-red-100 rounded-xl text-center">
                <span class="text-xs text-red-700 uppercase font-semibold tracking-wider">Subtotal estimado</span>
                <p id="valor-subtotal" class="text-xl font-extrabold text-red-600">R$ 0,00</p>
            </div>

            <!-- Observação -->
            <div>
                <label for="observacao" class="block text-sm font-semibold text-slate-700 mb-1">Observação (opcional)</label>
                <input type="text"
                       name="observacao"
                       id="observacao"
                       maxlength="255"
                       placeholder="Ex: Compra fornecedor X, Venda balcão..."
                       class="w-full px-4 py-2.5 bg-slate-50/80 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-600 transition-all text-sm">
            </div>

            <!-- Ações -->
            <div class="pt-2 flex items-center gap-3">
                <button type="submit"
                        class="flex-1 py-3 px-4 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all duration-200 text-sm">
                    Registrar
                </button>
                <a href="/movimentacoes/dashboard"
                   class="px-5 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl transition-all duration-200 text-sm text-center">
                    Cancelar
                </a>
            </div>
        </form>

    </main>

    <!-- Script Original Intacto -->
    <script>
        const selectProduto   = document.getElementById('select-produto');
        const inputQuantidade = document.getElementById('input-quantidade');
        const inputPreco      = document.getElementById('input-preco');
        const infoEstoque     = document.getElementById('info-estoque');
        const valorEstoque    = document.getElementById('valor-estoque');
        const infoSubtotal    = document.getElementById('info-subtotal');
        const valorSubtotal   = document.getElementById('valor-subtotal');

        // Ao selecionar produto: mostra estoque atual e preenche preço
        selectProduto.addEventListener('change', function () {
            const option = this.options[this.selectedIndex];
            const estoque = option.dataset.estoque;
            const preco   = option.dataset.preco;

            if (estoque !== undefined && this.value !== "") {
                valorEstoque.textContent = estoque;
                infoEstoque.classList.remove('hidden');

                // Pré-preenche o preço unitário com o preço cadastrado
                inputPreco.value = parseFloat(preco).toFixed(2);
            } else {
                infoEstoque.classList.add('hidden');
            }

            atualizarSubtotal();
        });

        // Atualiza o subtotal ao digitar quantidade ou preço
        function atualizarSubtotal() {
            const qtd   = parseFloat(inputQuantidade.value) || 0;
            const preco = parseFloat(inputPreco.value) || 0;
            const total = qtd * preco;

            if (qtd > 0 && preco > 0) {
                valorSubtotal.textContent = total.toLocaleString('pt-BR', {
                    style: 'currency',
                    currency: 'BRL'
                });
                infoSubtotal.classList.remove('hidden');
            } else {
                infoSubtotal.classList.add('hidden');
            }
        }

        inputQuantidade.addEventListener('input', atualizarSubtotal);
        inputPreco.addEventListener('input', atualizarSubtotal);
    </script>
</body>
</html>
