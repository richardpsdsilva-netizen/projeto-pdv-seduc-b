<!-- templates/usuarios/form.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ "Editar" if editando else "Novo" }} Usuário — Estoque AAPM</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-red-50/50 min-h-screen flex flex-col items-center justify-center p-4 font-sans text-slate-800">

    <main class="w-full max-w-lg bg-white rounded-2xl shadow-xl border border-red-100 p-8 space-y-6 my-8">
        
        <!-- Cabeçalho -->
        <div class="text-center space-y-2">
            <div class="px-3.5 py-1.5 bg-red-600 text-white font-bold text-sm rounded-xl shadow-md tracking-wider inline-flex items-center justify-center mb-1">
                AAPM
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">
                {{ "Editar usuário" if editando else "Novo usuário" }}
            </h1>
            <p class="text-sm text-slate-500">
                {{ "Atualize as credenciais e permissões do usuário" if editando else "Preencha os dados para cadastrar um novo usuário" }}
            </p>
        </div>

        <!-- Mensagem de Erro -->
        {% if erro %}
            <div class="p-3.5 bg-red-50 border border-red-200 text-red-700 text-sm font-medium rounded-xl text-center">
                {{ erro }}
            </div>
        {% endif %}

        <!-- Formulário -->
        <form action="{{ '/usuarios/' + editando.id|string + '/editar' if editando else '/usuarios/novo' }}"
              method="post"
              class="space-y-4">

            <!-- Nome -->
            <div>
                <label for="nome" class="block text-sm font-semibold text-slate-700 mb-1">Nome</label>
                <input type="text"
                       name="nome"
                       id="nome"
                       value="{{ editando.nome if editando else (valores.nome if valores else '') }}"
                       required
                       placeholder="Ex: João Silva"
                       class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-600 transition-all text-sm">
            </div>

            <!-- E-mail -->
            <div>
                <label for="email" class="block text-sm font-semibold text-slate-700 mb-1">E-mail</label>
                <input type="email"
                       name="email"
                       id="email"
                       value="{{ editando.email if editando else (valores.email if valores else '') }}"
                       required
                       placeholder="exemplo@senai.br"
                       class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-600 transition-all text-sm">
            </div>

            <!-- Senha -->
            <div>
                <label for="senha" class="block text-sm font-semibold text-slate-700 mb-1">Senha</label>
                <input type="password"
                       name="senha"
                       id="senha"
                       {% if editando %}
                           placeholder="Deixe vazio para não alterar"
                       {% else %}
                           placeholder="••••••••"
                           required
                           minlength="6"
                       {% endif %}
                       class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-600 transition-all text-sm">
            </div>

            <!-- Perfil de Acesso -->
            <div>
                <label for="role" class="block text-sm font-semibold text-slate-700 mb-1">Perfil de acesso</label>
                <select name="role"
                        id="role"
                        class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-600 transition-all text-sm">
                    <option value="operador"
                        {{ 'selected' if (editando and editando.role == 'operador') or (valores and valores.role == 'operador') else '' }}>
                        Operador
                    </option>
                    <option value="admin"
                        {{ 'selected' if (editando and editando.role == 'admin') or (valores and valores.role == 'admin') else '' }}>
                        Administrador
                    </option>
                </select>
            </div>

            <!-- Ações -->
            <div class="pt-2 flex items-center gap-3">
                <button type="submit"
                        class="flex-1 py-3 px-4 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all duration-200 text-sm">
                    {{ "Salvar alterações" if editando else "Criar usuário" }}
                </button>
                <a href="/usuarios"
                   class="px-5 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl transition-all duration-200 text-sm text-center">
                    Cancelar
                </a>
            </div>

        </form>

    </main>

</body>
</html>
