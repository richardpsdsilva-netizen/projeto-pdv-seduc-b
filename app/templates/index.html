<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo - Sistema da AAPM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-blue-dark: #123399;
            --bg-blue-main: #2554d7;
            --bg-blue-light: #3d6eff;
            --accent-glow: rgba(255, 255, 255, 0.4);
            --text-white: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.88);
            --btn-white: #ffffff;
            --btn-white-text: #1b44b8;
            --glass-card: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-blue-dark) 0%, var(--bg-blue-main) 50%, var(--bg-blue-light) 100%);
            position: relative;
            overflow-x: hidden;
            color: var(--text-white);
        }

        .background-waves {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .wave {
            transform-origin: center;
            will-change: transform;
        }

        .wave-left-outer {
            animation: moveCircleLeftSmooth 9s ease-in-out infinite alternate;
        }

        .wave-left-inner {
            animation: moveCircleLeftSmooth 11s ease-in-out infinite alternate-reverse;
        }

        .wave-right {
            animation: moveWaveRightSmooth 10s ease-in-out infinite alternate;
        }

        @keyframes moveCircleLeftSmooth {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            50% {
                transform: translate(45px, -30px) scale(1.08) rotate(3.5deg);
            }
            100% {
                transform: translate(-30px, 35px) scale(0.94) rotate(-2.5deg);
            }
        }

        @keyframes moveWaveRightSmooth {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            50% {
                transform: translate(-50px, 30px) scale(1.06) rotate(-3.5deg);
            }
            100% {
                transform: translate(35px, -35px) scale(0.95) rotate(2deg);
            }
        }

        .page-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1320px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 3rem;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1.15fr;
            gap: 4rem;
            align-items: center;
            width: 100%;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 520px;
            width: 100%;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            width: fit-content;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(10px);
        }

        .brand-badge-dot {
            width: 8px;
            height: 8px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px #ffffff;
        }

        .title-main {
            color: var(--text-white);
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            line-height: 1.08;
            margin-bottom: 1rem;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .title-sub {
            color: var(--text-sub);
            font-size: 1.2rem;
            font-weight: 400;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 36px;
            background-color: var(--btn-white);
            color: var(--btn-white-text);
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            border-radius: 8px;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-primary:hover {
            background-color: #f8fafc;
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 32px;
            background: transparent;
            color: var(--text-white);
            border: 2px solid rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #ffffff;
            transform: translateY(-3px);
        }

        .right-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 1000px;
        }

        .laptop-container {
            width: 100%;
            max-width: 620px;
            position: relative;
            animation: floatLaptop 6s ease-in-out infinite;
        }

        @keyframes floatLaptop {
            0%, 100% { transform: translateY(0px) rotateY(-2deg); }
            50% { transform: translateY(-14px) rotateY(1deg); }
        }

        .laptop-screen {
            background: #0b1120;
            border: 14px solid #1e293b;
            border-bottom: 18px solid #1e293b;
            border-radius: 16px 16px 0 0;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            aspect-ratio: 16 / 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .laptop-camera {
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            background: #030712;
            border: 1px solid #334155;
            border-radius: 50%;
            z-index: 10;
        }

        .laptop-screen::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 45%);
            pointer-events: none;
            z-index: 5;
        }

        #imagem-notebook {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border: none;
        }

        .laptop-base {
            height: 16px;
            background: linear-gradient(to bottom, #334155, #1e293b);
            border-radius: 0 0 20px 20px;
            position: relative;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.35);
        }

        .laptop-base::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 5px;
            background: #0f172a;
            border-radius: 0 0 4px 4px;
        }

        .laptop-bottom-lip {
            height: 4px;
            background: #0f172a;
            width: 100%;
            border-radius: 0 0 20px 20px;
        }

        .laptop-glow {
            position: absolute;
            bottom: -35px;
            left: 10%;
            width: 80%;
            height: 45px;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.3) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
            z-index: -1;
        }

        @media (max-width: 1024px) {
            .content-grid {
                grid-template-columns: 1fr;
                gap: 3.5rem;
                text-align: center;
            }

            .left-panel {
                align-items: center;
                max-width: 650px;
                margin: 0 auto;
            }

            .title-main {
                font-size: 2.6rem;
            }

            .right-panel {
                max-width: 550px;
                margin: 0 auto;
                width: 100%;
            }

            .action-buttons {
                justify-content: center;
            }
        }

        @media (max-width: 640px) {
            .page-container {
                padding: 2rem 1.25rem;
            }

            .title-main {
                font-size: 2rem;
            }

            .title-sub {
                font-size: 1rem;
            }

            .action-buttons {
                flex-direction: column;
                width: 100%;
            }

            .btn-primary, .btn-secondary {
                width: 100%;
            }

            .laptop-screen {
                border-width: 8px;
                border-bottom-width: 12px;
            }
        }
    </style>
</head>
<body>

    <svg class="background-waves" preserveAspectRatio="none" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
        <circle class="wave wave-left-outer" cx="-100" cy="1100" r="780" fill="rgba(255, 255, 255, 0.08)" />
        <circle class="wave wave-left-inner" cx="-100" cy="1100" r="540" fill="rgba(255, 255, 255, 0.1)" />
        <path class="wave wave-right" d="M 320 -100 C 620 150, 980 350, 780 700 C 620 980, 720 1080, 1100 1100 L 1100 -100 Z" fill="rgba(255, 255, 255, 0.07)" />
    </svg>

    <div class="page-container">
        <div class="content-grid">
            
            <!-- PAINEL ESQUERDO: Título, Subtítulo e Botões de Ação -->
            <div class="left-panel">
                <div class="brand-badge">
                    <span class="brand-badge-dot"></span>
                    <span>Portal AAPM</span>
                </div>

                <h1 class="title-main">Sistema da AAPM</h1>
                
                <p class="title-sub">
                    Bem-vindo à plataforma de gestão escolar e de recursos. Selecione uma opção para continuar.
                </p>

                <!-- Botões com as rotas mantidas -->
                <div class="action-buttons">
                    <a href="/auth/login" class="btn-primary">
                        <span>Entrar</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </a>

                    <a href="/auth/cadastro" class="btn-secondary">
                        <span>Cadastrar-se</span>
                    </a>
                </div>
            </div>

            <!-- PAINEL DIREITO: Animação do Computador (Notebook CSS com Imagem) -->
            <div class="right-panel">
                <div class="laptop-container">
                    <div class="laptop-screen">
                        <div class="laptop-camera"></div>
                        
                        <!-- Tag de imagem com a ID solicitada para alteração futura -->
                        <img id="imagem-notebook" 
                             src="" 
                             alt="Demonstração do Sistema da AAPM">
                    </div>
                    <div class="laptop-base"></div>
                    <div class="laptop-bottom-lip"></div>
                    <div class="laptop-glow"></div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
