<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo - Sistema do Ponto de Venda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-blue-dark: #0a192f;
            --bg-blue-main: #1e3a8a;
            --bg-blue-light: #3b82f6;
            --text-white: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.88);
            --btn-white: #ffffff;
            --btn-white-text: #1d4ed8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 80% 20%, #2563eb 0%, var(--bg-blue-dark) 80%);
            position: relative;
            overflow-x: hidden;
            color: var(--text-white);
        }

        .background-waves {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .wave {
            transform-origin: center;
            will-change: transform;
        }

        .wave-left-outer {
            animation: moveCircleLeftSmooth 9s ease-in-out infinite alternate;
        }

        .wave-left-inner {
            animation: moveCircleLeftSmooth 11s ease-in-out infinite alternate-reverse;
        }

        .wave-right {
            animation: moveWaveRightSmooth 10s ease-in-out infinite alternate;
        }

        @keyframes moveCircleLeftSmooth {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(45px, -30px) scale(1.08) rotate(3.5deg); }
            100% { transform: translate(-30px, 35px) scale(0.94) rotate(-2.5deg); }
        }

        @keyframes moveWaveRightSmooth {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(-50px, 30px) scale(1.06) rotate(-3.5deg); }
            100% { transform: translate(35px, -35px) scale(0.95) rotate(2deg); }
        }

        .page-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1320px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 3rem;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 4rem;
            align-items: center;
            width: 100%;
        }

        /* PAINEL ESQUERDO */
        .left-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 520px;
            width: 100%;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            width: fit-content;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(12px);
        }

        .brand-badge-dot {
            width: 8px;
            height: 8px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
        }

        .title-main {
            color: var(--text-white);
            font-size: 3.4rem;
            font-weight: 900;
            letter-spacing: -1px;
            line-height: 1.05;
            margin-bottom: 1.2rem;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .title-sub {
            color: var(--text-sub);
            font-size: 1.15rem;
            font-weight: 400;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 38px;
            background-color: var(--btn-white);
            color: var(--btn-white-text);
            font-size: 1rem;
            font-weight: 800;
            border-radius: 12px;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-primary:hover {
            background-color: #f8fafc;
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
        }

        /* PAINEL DIREITO: COMPUTADOR COM IMAGEM EM TELA CHEIA */
        .right-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 1500px;
        }

        .laptop-container {
            width: 100%;
            max-width: 620px;
            position: relative;
            transform-style: preserve-3d;
            animation: floatLaptop 6s ease-in-out infinite;
            transition: transform 0.5s ease;
        }

        .laptop-container:hover {
            transform: rotateX(2deg) rotateY(-2deg) scale(1.02);
        }

        @keyframes floatLaptop {
            0%, 100% { transform: translateY(0px) rotateX(5deg) rotateY(-5deg); }
            50% { transform: translateY(-14px) rotateX(3deg) rotateY(-1deg); }
        }

        /* Moldura de Alumínio Superior */
        .laptop-screen-frame {
            background: linear-gradient(145deg, #2d3238, #15181b);
            border-radius: 18px 18px 4px 4px;
            padding: 10px 10px 0 10px;
            box-shadow: 
                0 0 0 1px rgba(255, 255, 255, 0.12) inset,
                0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        /* Notch com Câmera */
        .camera-notch {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 16px;
            background: #090a0f;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .camera-lens {
            width: 6px;
            height: 6px;
            background: #042f2e;
            border: 1px solid #0f766e;
            border-radius: 50%;
        }

        /* Display Interno */
        .screen-display {
            background: #000;
            border-radius: 10px 10px 0 0;
            aspect-ratio: 16 / 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Reflexo do Vidro */
        .screen-glass-glare {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0) 45%);
            pointer-events: none;
            z-index: 5;
        }

        /* Barra Superior Semi-Transparente */
        .screen-header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 3;
        }

        .window-dots {
            display: flex;
            gap: 7px;
        }

        .window-dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot-red { background: #ff5f56; box-shadow: 0 0 5px rgba(255, 95, 86, 0.5); }
        .dot-yellow { background: #ffbd2e; box-shadow: 0 0 5px rgba(255, 189, 46, 0.5); }
        .dot-green { background: #27c93f; box-shadow: 0 0 5px rgba(39, 201, 63, 0.5); }

        .window-title-fake {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 0.5px;
            background: rgba(0, 0, 0, 0.35);
            padding: 3px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Área da Imagem cobrindo 100% da tela */
        .screen-body-mockup {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .screen-body-mockup img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Preenche a tela inteira sem distorcer */
            display: block;
        }

        /* Barra de Rodapé Semi-Transparente */
        .screen-footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 6px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 3;
        }

        .status-online {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        /* Dobradiça e Base */
        .laptop-hinge {
            height: 6px;
            background: linear-gradient(to right, #111, #333, #111);
            margin: 0 auto;
            width: 85%;
            border-radius: 0 0 2px 2px;
        }

        .laptop-base-body {
            height: 16px;
            background: linear-gradient(180deg, #3d434a 0%, #1a1d21 100%);
            border-radius: 2px 2px 18px 18px;
            position: relative;
            box-shadow: 
                0 0 0 1px rgba(255, 255, 255, 0.15) inset,
                0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .laptop-opening-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 4px;
            background: #111315;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
        }

        .laptop-ambient-glow {
            position: absolute;
            bottom: -35px;
            left: 5%;
            width: 90%;
            height: 45px;
            background: radial-gradient(ellipse at center, rgba(59, 130, 246, 0.4) 0%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            z-index: -1;
            filter: blur(10px);
        }

        /* RESPONSIVIDADE */
        @media (max-width: 1024px) {
            .content-grid {
                grid-template-columns: 1fr;
                gap: 3.5rem;
                text-align: center;
            }

            .left-panel {
                align-items: center;
                max-width: 650px;
                margin: 0 auto;
            }

            .title-main { font-size: 2.7rem; }

            .right-panel {
                max-width: 520px;
                margin: 0 auto;
                width: 100%;
            }

            .action-buttons { justify-content: center; }
        }

        @media (max-width: 640px) {
            .page-container { padding: 2rem 1.25rem; }
            .title-main { font-size: 2.1rem; }
            .title-sub { font-size: 1rem; }
            .action-buttons { width: 100%; }
            .btn-primary { width: 100%; }
        }
    </style>
</head>
<body>

    <svg class="background-waves" preserveAspectRatio="none" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
        <circle class="wave wave-left-outer" cx="-100" cy="1100" r="780" fill="rgba(255, 255, 255, 0.08)" />
        <circle class="wave wave-left-inner" cx="-100" cy="1100" r="540" fill="rgba(255, 255, 255, 0.1)" />
        <path class="wave wave-right" d="M 320 -100 C 620 150, 980 350, 780 700 C 620 980, 720 1080, 1100 1100 L 1100 -100 Z" fill="rgba(255, 255, 255, 0.07)" />
    </svg>

    <div class="page-container">
        <div class="content-grid">
            
            <!-- PAINEL ESQUERDO -->
            <div class="left-panel">
                <div class="brand-badge">
                    <span class="brand-badge-dot"></span>
                    <span>Ponto de Venda</span>
                </div>

                <h1 class="title-main">Sistema 
                    
                    
                    
                    
                    
                    
                    
                    
                    
                    
                    
                    onto de Venda</h1>
                
                <p class="title-sub">
                    Bem-vindo à plataforma de gestão de produtos e de recursos. Selecione a opção abaixo para acessar o sistema.
                </p>

                <div class="action-buttons">
                    <a href="/auth/login" class="btn-primary">
                        <span>Entrar</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </a>
                </div>
            </div>

            <!-- PAINEL DIREITO: COMPUTADOR COM IMAGEM FULL SCREEN -->
            <div class="right-panel">
                <div class="laptop-container">
                    
                    <div class="laptop-screen-frame">
                        <div class="camera-notch">
                            <div class="camera-lens"></div>
                        </div>

                        <div class="screen-display">
                            <div class="screen-glass-glare"></div>
                            
                            <!-- Imagem preenchendo a tela inteira -->
                            <div class="screen-body-mockup">
                                <img src="/static/uploads/watermarked_img_7932754934862722412.jpg" alt="Gatinho usando o computador">
                            </div>

                            <!-- Barra Superior (Efeito de Vidro por cima) -->
                            <div class="screen-header-bar">
                                <div class="window-dots">
                                    <span class="dot-red"></span>
                                    <span class="dot-yellow"></span>
                                    <span class="dot-green"></span>
                                </div>
                                <div class="window-title-fake"></div>
                                <div style="width: 38px;"></div>
                            </div>

                            <!-- Barra de Rodapé (Efeito de Vidro por cima) -->
                            <div class="screen-footer-bar">
                                <span class="status-online">
                                    <span class="status-dot"></span> Conectado
                                </span>
                                <span></span>
                            </div>
                        </div>
                    </div>

                    <div class="laptop-hinge"></div>
                    <div class="laptop-base-body">
                        <div class="laptop-opening-notch"></div>
                    </div>

                    <div class="laptop-ambient-glow"></div>

                </div>
            </div>

        </div>
    </div>

</body>
</html>
