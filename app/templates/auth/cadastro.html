<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - AAPM</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-red-50/50 min-h-screen flex flex-col items-center justify-center p-4 font-sans text-slate-800">

    <main class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-red-100 p-8 space-y-6">
        
        <!-- Cabeçalho -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-red-600 text-white font-bold text-xl rounded-2xl shadow-md mb-1">
                AAPM
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Criar conta</h1>
            <p class="text-sm text-slate-500">Preencha os dados abaixo para se cadastrar</p>
        </div>

        <!-- Formulário de Cadastro -->
        <form action="/auth/cadastro" method="post" class="space-y-4">
            <div>
                <label for="nome" class="block text-sm font-semibold text-slate-700 mb-1">Nome</label>
                <input 
                    type="text" 
                    id="nome" 
                    name="nome" 
                    required 
                    placeholder="Seu nome completo"
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-600 transition-all text-sm"
                >
            </div>

            <div>
                <label for="email" class="block text-sm font-semibold text-slate-700 mb-1">E-mail</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required 
                    placeholder="seu@email.com"
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-600 transition-all text-sm"
                >
            </div>

            <div>
                <label for="senha" class="block text-sm font-semibold text-slate-700 mb-1">Senha</label>
                <input 
                    type="password" 
                    id="senha" 
                    name="senha" 
                    required 
                    placeholder="Crie uma senha segura"
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-600 transition-all text-sm"
                >
            </div>

            <button 
                type="submit" 
                class="w-full py-3 px-4 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all duration-200 text-sm pt-3 mt-2"
            >
                Cadastrar
            </button>
        </form>

        <!-- Link para Login -->
        <div class="text-center pt-2 border-t border-slate-100">
            <p class="text-sm text-slate-600">
                Já tem conta? 
                <a href="/auth/login" class="font-semibold text-red-600 hover:text-red-700 hover:underline">
                    Entrar
                </a>
            </p>
        </div>

    </main>

    <!-- Rodapé simples -->
    <footer class="mt-8 text-xs text-slate-400">
        &copy; 2026 Associação de Pais e Mestres
    </footer>

</body>
</html>
