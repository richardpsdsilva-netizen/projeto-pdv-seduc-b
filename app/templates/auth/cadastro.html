<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro — AAPM SENAI</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Container do Fundo Animado */
        .cubes-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0; /* Fica no fundo */
            margin: 0;
            padding: 0;
        }

        /* Estilo base de cada cubo */
        .cubes-bg li {
            position: absolute;
            list-style: none;
            display: block;
            width: 20px;
            height: 20px;
            background: rgba(220, 38, 38, 0.12); /* Vermelho translúcido */
            border: 1px solid rgba(220, 38, 38, 0.25);
            border-radius: 12px; /* Cantos arredondados */
            bottom: -150px;
            animation: moveCubes 22s infinite ease-in-out;
        }

        /* Animação CSS: Subindo, girando e descendo */
        @keyframes moveCubes {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            50% {
                transform: translateY(-50vh) rotate(180deg);
            }
            70% {
                transform: translateY(-35vh) rotate(240deg);
            }
            100% {
                transform: translateY(-105vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Distribuição dos 16 cubos com posições e tempos variados */
        .cubes-bg li:nth-child(1)  { left: 25%; width: 80px; height: 80px; animation-delay: -2s;  animation-duration: 26s; }
        .cubes-bg li:nth-child(2)  { left: 10%; width: 30px; height: 30px; animation-delay: -7s;  animation-duration: 20s; }
        .cubes-bg li:nth-child(3)  { left: 70%; width: 45px; height: 45px; animation-delay: -12s; animation-duration: 22s; }
        .cubes-bg li:nth-child(4)  { left: 40%; width: 60px; height: 60px; animation-delay: -5s;  animation-duration: 30s; }
        .cubes-bg li:nth-child(5)  { left: 65%; width: 25px; height: 25px; animation-delay: -15s; animation-duration: 18s; }
        .cubes-bg li:nth-child(6)  { left: 85%; width: 90px; height: 90px; animation-delay: -8s;  animation-duration: 28s; }
        .cubes-bg li:nth-child(7)  { left: 55%; width: 50px; height: 50px; animation-delay: -18s; animation-duration: 24s; }
        .cubes-bg li:nth-child(8)  { left: 15%; width: 20px; height: 20px; animation-delay: -3s;  animation-duration: 21s; }
        .cubes-bg li:nth-child(9)  { left: 3%;  width: 40px; height: 40px; animation-delay: -10s; animation-duration: 32s; }
        .cubes-bg li:nth-child(10) { left: 92%; width: 70px; height: 70px; animation-delay: -14s; animation-duration: 25s; }
        .cubes-bg li:nth-child(11) { left: 32%; width: 35px; height: 35px; animation-delay: -9s;  animation-duration: 23s; }
        .cubes-bg li:nth-child(12) { left: 48%; width: 75px; height: 75px; animation-delay: -16s; animation-duration: 27s; }
        .cubes-bg li:nth-child(13) { left: 78%; width: 20px; height: 20px; animation-delay: -4s;  animation-duration: 19s; }
        .cubes-bg li:nth-child(14) { left: 20%; width: 55px; height: 55px; animation-delay: -11s; animation-duration: 29s; }
        .cubes-bg li:nth-child(15) { left: 80%; width: 40px; height: 40px; animation-delay: -1s;  animation-duration: 21s; }
        .cubes-bg li:nth-child(16) { left: 60%; width: 30px; height: 30px; animation-delay: -13s; animation-duration: 25s; }
    </style>
</head>
<body class="bg-red-50/40 min-h-screen flex flex-col items-center justify-center p-4 font-sans text-slate-800 relative">

    <!-- Fundo Animado com 16 Cubos -->
    <ul class="cubes-bg">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>

    <!-- Card Principal de Cadastro -->
    <main class="w-full max-w-md bg-white/90 backdrop-blur-md rounded-2xl shadow-xl border border-red-100/80 p-8 space-y-6 my-8 z-10">
        
        <!-- Cabeçalho -->
        <div class="text-center space-y-2">
            <div class="px-3.5 h-12 bg-red-600 text-white font-bold text-lg rounded-2xl shadow-md mb-1 inline-flex items-center justify-center tracking-wider transform transition-transform duration-300 hover:scale-105">
                AAPM
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Criar conta</h1>
            <p class="text-sm text-slate-500">Preencha os dados abaixo para se cadastrar</p>
        </div>

        <!-- Alerta de Erro -->
        {% if erro %}
            <div class="p-3.5 bg-red-50/90 backdrop-blur-md border border-red-200 text-red-700 text-sm font-medium rounded-xl text-center shadow-sm">
                {{ erro }}
            </div>
        {% endif %}

        <!-- Formulário de Cadastro -->
        <form action="/auth/cadastro" method="post" class="space-y-4">
            <div>
                <label for="nome" class="block text-sm font-semibold text-slate-700 mb-1.5">Nome</label>
                <input 
                    type="text" 
                    id="nome" 
                    name="nome" 
                    required 
                    placeholder="Seu nome completo"
                    class="w-full px-4 py-2.5 bg-slate-50/80 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-600 transition-all text-sm text-slate-900"
                >
            </div>

            <div>
                <label for="email" class="block text-sm font-semibold text-slate-700 mb-1.5">E-mail</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required 
                    placeholder="seu@email.com"
                    class="w-full px-4 py-2.5 bg-slate-50/80 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-600 transition-all text-sm text-slate-900"
                >
            </div>

            <div>
                <label for="senha" class="block text-sm font-semibold text-slate-700 mb-1.5">Senha</label>
                <input 
                    type="password" 
                    id="senha" 
                    name="senha" 
                    required 
                    placeholder="Crie uma senha segura"
                    class="w-full px-4 py-2.5 bg-slate-50/80 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-600 transition-all text-sm text-slate-900"
                >
            </div>

            <button 
                type="submit" 
                class="w-full py-3 px-4 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all duration-200 hover:-translate-y-0.5 text-sm mt-2"
            >
                Cadastrar
            </button>
        </form>

        <!-- Link para Login -->
        <div class="text-center pt-2 border-t border-slate-200/80">
            <p class="text-sm text-slate-600">
                Já tem conta? 
                <a href="/auth/login" class="font-semibold text-red-600 hover:text-red-700 hover:underline">
                    Entrar
                </a>
            </p>
        </div>

    </main>

    <!-- Rodapé simples -->
    <footer class="mt-8 text-xs text-slate-400 z-10 font-medium">
        &copy; Senai
    </footer>

</body>
</html>
