<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #2554d7;
            position: relative;
            overflow: hidden;
        }

        /* --- ANIMAÇÃO EXCLUSIVA DAS ONDAS DO FUNDO --- */
        .background-waves {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .wave {
            transform-origin: center;
            will-change: transform;
        }

        .wave-left-outer {
            animation: moveCircleLeftSmooth 8s ease-in-out infinite alternate;
        }

        .wave-left-inner {
            animation: moveCircleLeftSmooth 10s ease-in-out infinite alternate-reverse;
        }

        .wave-right {
            animation: moveWaveRightSmooth 9s ease-in-out infinite alternate;
        }

        @keyframes moveCircleLeftSmooth {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            50% {
                transform: translate(45px, -30px) scale(1.08) rotate(3.5deg);
            }
            100% {
                transform: translate(-30px, 35px) scale(0.94) rotate(-2.5deg);
            }
        }

        @keyframes moveWaveRightSmooth {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            50% {
                transform: translate(-50px, 30px) scale(1.06) rotate(-3.5deg);
            }
            100% {
                transform: translate(35px, -35px) scale(0.95) rotate(2deg);
            }
        }

        /* Container Principal */
        .login-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 320px;
            padding: 20px;
        }

        .title {
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Feedback / Mensagens Jinja2 */
        .msg-alert {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-size: 12px;
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
        }

        .msg-erro {
            color: #ff2a2a;
            border: 1px solid rgba(255, 42, 42, 0.5);
        }

        .msg-sucesso {
            color: #2aff71;
            border: 1px solid rgba(42, 255, 113, 0.5);
        }

        /* Formulário e Campos */
        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        /* Ícones da esquerda */
        .input-group > svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: rgba(255, 255, 255, 0.8);
            stroke-width: 2;
            fill: none;
            pointer-events: none;
        }

        .input-group input {
            width: 100%;
            padding: 12px 40px 12px 40px; /* Adicionado espaçamento à direita para o botão */
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 3px;
            color: #ffffff;
            font-size: 12px;
            letter-spacing: 1px;
            outline: none;
            transition: border-color 0.3s;
        }

        /* Desativa o ícone padrão de exibir senha do Edge/IE para não duplicar */
        input::-ms-reveal,
        input::-ms-clear {
            display: none;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.8);
            font-size: 11px;
            letter-spacing: 1px;
        }

        .input-group input:focus {
            border-color: #ffffff;
        }

        /* Botão de Exibir Senha (Branco) */
        .btn-toggle-senha {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            outline: none;
        }

        .btn-toggle-senha svg {
            width: 18px;
            height: 18px;
            stroke: #ffffff; /* Cor branca pura */
            stroke-width: 2;
            fill: none;
            transition: opacity 0.2s;
        }

        .btn-toggle-senha:hover svg {
            opacity: 0.8;
        }

        /* Botão de Login */
        .btn-login {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            background-color: #ffffff;
            color: #2151cc;
            border: none;
            border-radius: 3px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-login:hover {
            background-color: #f8fafc;
        }

        .btn-login:active {
            transform: scale(0.99);
        }

        /* Link Cadastro */
        .register-text {
            margin-top: 15px;
            color: #ffffff;
            font-size: 12px;
            opacity: 0.9;
        }

        .register-text a {
            color: #ffffff;
            font-weight: 600;
            text-decoration: underline;
        }

        .register-text a:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <svg class="background-waves" preserveAspectRatio="none" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
        <circle class="wave wave-left-outer" cx="-100" cy="1100" r="750" fill="rgba(255, 255, 255, 0.06)" />
        <circle class="wave wave-left-inner" cx="-100" cy="1100" r="520" fill="rgba(255, 255, 255, 0.08)" />
        <path class="wave wave-right" d="M 350 -100 C 650 150, 980 350, 780 700 C 620 980, 720 1080, 1100 1100 L 1100 -100 Z" fill="rgba(255, 255, 255, 0.07)" />
    </svg>

    <div class="login-container">
        <h1 class="title"></h1>

        {% if erro %}
            <div class="msg-alert msg-erro">{{ erro }}</div>
        {% endif %}

        {% if request.query_params.get("cadastro") == "ok" %}
            <div class="msg-alert msg-sucesso">Cadastro realizado! faça login.</div>
        {% endif %}

        <form class="login-form" action="/auth/login" method="post">
            <div class="input-group">
                <svg viewBox="0 0 24 24">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                <input type="email" name="email" placeholder="EMAIL" required autocomplete="off">
            </div>

            <div class="input-group">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <input type="password" id="senha" name="senha" placeholder="SENHA" required>
                
                <!-- Botão dinâmico branco -->
                <button type="button" class="btn-toggle-senha" id="toggleSenha" aria-label="Exibir senha">
                    <svg id="eyeIcon" viewBox="0 0 24 24">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>

            <button type="submit" class="btn-login">ENTRAR</button>
        </form>

        <p class="register-text"><a href="/auth/cadastro"></a></p>
    </div>

    <script>
        const toggleSenhaBtn = document.getElementById('toggleSenha');
        const senhaInput = document.getElementById('senha');
        const eyeIcon = document.getElementById('eyeIcon');

        toggleSenhaBtn.addEventListener('click', () => {
            const isPassword = senhaInput.type === 'password';
            
            // Alterna o tipo do input
            senhaInput.type = isPassword ? 'text' : 'password';
            
            // Alterna o ícone entre olho aberto e olho cortado
            if (isPassword) {
                eyeIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            } else {
                eyeIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        });
    </script>
</body>
</html>
