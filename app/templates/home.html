<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — AAPM SENAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff; /* Fundo da Sidebar Branca */
        }

        /* --- SIDEBAR BRANCA DA ESQUERDA --- */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            z-index: 1;
            color: #1e293b;
        }

        .btn-close-sidebar {
            background: none;
            border: none;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            margin-left: 10px;
        }

        .btn-close-sidebar svg {
            width: 24px;
            height: 24px;
            stroke: #1e293b;
            stroke-width: 2.5;
            fill: none;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* --- BOTÃO DA SIDEBAR (RETÂNGULO COM ANIMAÇÃO DE ONDAS) --- */
        .sidebar-item {
            position: relative;
            display: flex;
            align-items: center;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 12px;
            overflow: hidden;
            background: transparent;
            color: #334155;
            transition: transform 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        }

        .sidebar-item-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 15px;
            font-weight: 600;
        }

        .sidebar-item svg.icon {
            width: 20px;
            height: 20px;
            stroke: #334155;
            fill: none;
            stroke-width: 2;
            transition: stroke 0.2s ease;
        }

        /* Ondas animadas internas do botão */
        .item-waves {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sidebar-item.active,
        .sidebar-item:hover {
            background: #2554d7; /* Fundo Azul */
            color: #ffffff;
            transform: translateX(4px);
            box-shadow: 0 6px 15px rgba(37, 84, 215, 0.3);
        }

        .sidebar-item.active svg.icon,
        .sidebar-item:hover svg.icon {
            stroke: #ffffff;
        }

        .sidebar-item.active .item-waves,
        .sidebar-item:hover .item-waves {
            opacity: 1;
        }

        /* --- TELA PRINCIPAL (EFEITO SLIDE & SCALE 3D EM DESKTOP) --- */
        .main-screen {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #2554d7; /* Fundo Azul Original */
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1), 
                        border-radius 0.45s cubic-bezier(0.25, 1, 0.5, 1),
                        box-shadow 0.45s ease;
            transform-origin: left center;
        }

        /* Animação ao Abrir a Sidebar */
        body.menu-open .main-screen {
            transform: translateX(280px) scale(0.88);
            border-radius: 24px;
            box-shadow: -20px 20px 40px rgba(0, 0, 0, 0.25);
        }

        /* Overlay transparente para fechar ao clicar na tela deslocada */
        .main-screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: none;
            cursor: pointer;
        }

        body.menu-open .main-screen-overlay {
            display: block;
        }

        /* Botão Hambúrguer */
        .app-header {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 5;
        }

        .btn-menu {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            outline: none;
            display: flex;
            align-items: center;
        }

        .btn-menu svg {
            width: 28px;
            height: 28px;
            stroke: #ffffff;
            stroke-width: 2;
            fill: none;
        }

        /* --- ANIMAÇÃO DAS ONDAS DO FUNDO (TELAS E BOTÕES) --- */
        .background-waves {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .wave {
            transform-origin: center;
            will-change: transform;
        }

        .wave-left-outer {
            animation: moveCircleLeftSmooth 8s ease-in-out infinite alternate;
        }

        .wave-left-inner {
            animation: moveCircleLeftSmooth 10s ease-in-out infinite alternate-reverse;
        }

        .wave-right {
            animation: moveWaveRightSmooth 9s ease-in-out infinite alternate;
        }

        @keyframes moveCircleLeftSmooth {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(45px, -30px) scale(1.08) rotate(3.5deg); }
            100% { transform: translate(-30px, 35px) scale(0.94) rotate(-2.5deg); }
        }

        @keyframes moveWaveRightSmooth {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(-50px, 30px) scale(1.06) rotate(-3.5deg); }
            100% { transform: translate(35px, -35px) scale(0.95) rotate(2deg); }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR BRANCA DA ESQUERDA -->
    <aside class="sidebar">
        <button class="btn-close-sidebar" id="closeSidebarBtn" aria-label="Fechar menu">
            <svg viewBox="0 0 24 24">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>

        <nav class="sidebar-menu">
            <!-- DASHBOARD -->
            <a href="{{ url_for('dashboard') }}" class="sidebar-item {{ 'active' if request.endpoint == 'dashboard' else '' }}">
                <svg class="item-waves" viewBox="0 0 200 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                    <circle class="wave wave-left-outer" cx="10" cy="80" r="60" fill="rgba(255, 255, 255, 0.15)" />
                    <circle class="wave wave-left-inner" cx="180" cy="-20" r="50" fill="rgba(255, 255, 255, 0.12)" />
                </svg>
                <div class="sidebar-item-content">
                    <svg class="icon" viewBox="0 0 24 24">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span>Dashboard</span>
                </div>
            </a>

            <!-- CATEGORIAS -->
            <a href="{{ url_for('listar_categorias') }}" class="sidebar-item {{ 'active' if request.endpoint == 'listar_categorias' else '' }}">
                <svg class="item-waves" viewBox="0 0 200 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                    <circle class="wave wave-left-outer" cx="10" cy="80" r="60" fill="rgba(255, 255, 255, 0.15)" />
                    <circle class="wave wave-left-inner" cx="180" cy="-20" r="50" fill="rgba(255, 255, 255, 0.12)" />
                </svg>
                <div class="sidebar-item-content">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                        <line x1="7" y1="7" x2="7.01" y2="7"></line>
                    </svg>
                    <span>Categorias</span>
                </div>
            </a>

            <!-- PRODUTOS -->
            <a href="{{ url_for('produtos') }}" class="sidebar-item {{ 'active' if request.endpoint == 'produtos' else '' }}">
                <svg class="item-waves" viewBox="0 0 200 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                    <circle class="wave wave-left-outer" cx="10" cy="80" r="60" fill="rgba(255, 255, 255, 0.15)" />
                    <circle class="wave wave-left-inner" cx="180" cy="-20" r="50" fill="rgba(255, 255, 255, 0.12)" />
                </svg>
                <div class="sidebar-item-content">
                    <svg class="icon" viewBox="0 0 24 24">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span>Produtos</span>
                </div>
            </a>

            <!-- PEDIDOS -->
            <a href="{{ url_for('pedidos') }}" class="sidebar-item {{ 'active' if request.endpoint == 'pedidos' else '' }}">
                <svg class="item-waves" viewBox="0 0 200 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                    <circle class="wave wave-left-outer" cx="10" cy="80" r="60" fill="rgba(255, 255, 255, 0.15)" />
                    <circle class="wave wave-left-inner" cx="180" cy="-20" r="50" fill="rgba(255, 255, 255, 0.12)" />
                </svg>
                <div class="sidebar-item-content">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                    </svg>
                    <span>Pedidos</span>
                </div>
            </a>

            <!-- PERFIL -->
            <a href="{{ url_for('perfil') }}" class="sidebar-item {{ 'active' if request.endpoint == 'perfil' else '' }}">
                <svg class="item-waves" viewBox="0 0 200 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                    <circle class="wave wave-left-outer" cx="10" cy="80" r="60" fill="rgba(255, 255, 255, 0.15)" />
                    <circle class="wave wave-left-inner" cx="180" cy="-20" r="50" fill="rgba(255, 255, 255, 0.12)" />
                </svg>
                <div class="sidebar-item-content">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Perfil</span>
                </div>
            </a>

            <!-- SEGURANÇA -->
            <a href="{{ url_for('seguranca') }}" class="sidebar-item {{ 'active' if request.endpoint == 'seguranca' else '' }}">
                <svg class="item-waves" viewBox="0 0 200 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                    <circle class="wave wave-left-outer" cx="10" cy="80" r="60" fill="rgba(255, 255, 255, 0.15)" />
                    <circle class="wave wave-left-inner" cx="180" cy="-20" r="50" fill="rgba(255, 255, 255, 0.12)" />
                </svg>
                <div class="sidebar-item-content">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                    <span>Segurança</span>
                </div>
            </a>
        </nav>
    </aside>

    <!-- TELA PRINCIPAL -->
    <main class="main-screen">
        <div class="main-screen-overlay" id="screenOverlay"></div>

        <header class="app-header">
            <button class="btn-menu" id="openSidebarBtn" aria-label="Abrir menu">
                <svg viewBox="0 0 24 24">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="15" y2="12"></line>
                    <line x1="3" y1="18" x2="18" y2="18"></line>
                </svg>
            </button>
        </header>

        <!-- ONDAS DE FUNDO ANIMADAS DA TELA PRINCIPAL -->
        <svg class="background-waves" preserveAspectRatio="none" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
            <circle class="wave wave-left-outer" cx="-100" cy="1100" r="750" fill="rgba(255, 255, 255, 0.06)" />
            <circle class="wave wave-left-inner" cx="-100" cy="1100" r="520" fill="rgba(255, 255, 255, 0.08)" />
            <path class="wave wave-right" d="M 350 -100 C 650 150, 980 350, 780 700 C 620 980, 720 1080, 1100 1100 L 1100 -100 Z" fill="rgba(255, 255, 255, 0.07)" />
        </svg>
    </main>

    <script>
        const body = document.body;
        const openSidebarBtn = document.getElementById('openSidebarBtn');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');
        const screenOverlay = document.getElementById('screenOverlay');

        // Abertura e fechamento da sidebar
        openSidebarBtn.addEventListener('click', () => {
            body.classList.add('menu-open');
        });

        function closeMenu() {
            body.classList.remove('menu-open');
        }

        closeSidebarBtn.addEventListener('click', closeMenu);
        screenOverlay.addEventListener('click', closeMenu);
    </script>
</body>
</html>
