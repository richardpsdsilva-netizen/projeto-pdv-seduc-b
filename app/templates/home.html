<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}POS System{% endblock %}</title>
    
    <!-- Ícones Lucide para o estilo moderno -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #2554d7;
            position: relative;
            overflow-x: hidden;
            color: #1d1d1f;
            display: flex;
            padding: 20px;
        }

        /* --- BACKGROUND WAVES ANIMATION --- */
        .background-waves {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .wave {
            transform-origin: center;
            will-change: transform;
        }

        .wave-left-outer {
            animation: moveCircleLeftSmooth 8s ease-in-out infinite alternate;
        }

        .wave-left-inner {
            animation: moveCircleLeftSmooth 10s ease-in-out infinite alternate-reverse;
        }

        .wave-right {
            animation: moveWaveRightSmooth 9s ease-in-out infinite alternate;
        }

        @keyframes moveCircleLeftSmooth {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(45px, -30px) scale(1.08) rotate(3.5deg); }
            100% { transform: translate(-30px, 35px) scale(0.94) rotate(-2.5deg); }
        }

        @keyframes moveWaveRightSmooth {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(-50px, 30px) scale(1.06) rotate(-3.5deg); }
            100% { transform: translate(35px, -35px) scale(0.95) rotate(2deg); }
        }

        /* --- SIDEBAR RECTANGULAR & FLOATING TOGGLE STYLE --- */
        .sidebar {
            position: fixed;
            top: 20px;
            left: 20px;
            bottom: 20px;
            width: 250px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 28px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Estado Retraído */
        .sidebar.collapsed {
            width: 82px;
            padding: 24px 12px;
        }

        /* Topo da Sidebar com Logo Genérico + Botão Flutuante */
        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding: 0 8px;
            position: relative;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #1e1b4b;
            font-weight: 800;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .sidebar.collapsed .brand-title {
            opacity: 0;
            display: none;
        }

        /* Botão Circular Flutuante na Borda */
        .btn-toggle {
            position: absolute;
            right: -24px;
            top: 4px;
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.08);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            z-index: 15;
            color: #475569;
        }

        .btn-toggle:hover {
            background: #f8fafc;
            transform: scale(1.08);
            color: #1e293b;
        }

        .btn-toggle i {
            width: 16px;
            height: 16px;
            transition: transform 0.4s ease;
        }

        .sidebar.collapsed .btn-toggle i {
            transform: rotate(180deg);
        }

        /* Divisória do Menu */
        .menu-divider {
            height: 1px;
            background: rgba(0, 0, 0, 0.05);
            margin: 12px 8px;
        }

        /* Lista de Links */
        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-links a {
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 12px 14px;
            border-radius: 16px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 14px;
            white-space: nowrap;
        }

        .nav-links a i {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .nav-links a:hover {
            background-color: #f1f5f9;
            color: #1e293b;
        }

        /* Item Ativo Estilo Moderno */
        .nav-links a.active {
            background-color: #eff6ff;
            color: #2563eb;
        }

        /* Ajustes para Sidebar Collapsed */
        .sidebar.collapsed .nav-links a {
            padding: 12px;
            justify-content: center;
        }

        .sidebar.collapsed .link-text {
            display: none;
        }

        /* Botão Logout em Destaque */
        .btn-logout {
            color: #ef4444 !important;
        }

        .btn-logout:hover {
            background-color: #fef2f2 !important;
        }

        /* --- CONTEÚDO PRINCIPAL --- */
        .main-container {
            position: relative;
            z-index: 2;
            flex-grow: 1;
            padding: 10px 20px;
            margin-left: 270px;
            width: calc(100% - 270px);
            transition: margin-left 0.35s cubic-bezier(0.16, 1, 0.3, 1), width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sidebar.collapsed ~ .main-container {
            margin-left: 102px;
            width: calc(100% - 102px);
        }

        .msg-alert {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 16px;
            font-size: 12px;
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
        }

        .msg-erro {
            background: rgba(239, 68, 68, 0.4);
        }
    </style>
</head>
<body>

    <!-- Background Waves Animation -->
    <svg class="background-waves" preserveAspectRatio="none" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
        <circle class="wave wave-left-outer" cx="-100" cy="1100" r="750" fill="rgba(255, 255, 255, 0.06)" />
        <circle class="wave wave-left-inner" cx="-100" cy="1100" r="520" fill="rgba(255, 255, 255, 0.08)" />
        <path class="wave wave-right" d="M 350 -100 C 650 150, 980 350, 780 700 C 620 980, 720 1080, 1100 1100 L 1100 -100 Z" fill="rgba(255, 255, 255, 0.07)" />
    </svg>

    <!-- Sidebar Modern Style -->
    <aside class="sidebar" id="sidebar">
        <div>
            <!-- Header com Ícone e Botão Toggle Circular Flutuante -->
            <div class="sidebar-header">
                <a href="/" class="brand-logo">
                    <div class="logo-icon">
                        <i data-lucide="layout-grid"></i>
                    </div>
                    <span class="brand-title">POS System</span>
                </a>
                
                <button class="btn-toggle" id="toggleBtn" title="Alternar Menu">
                    <i data-lucide="chevron-left"></i>
                </button>
            </div>

            <!-- Links Superiores -->
            <ul class="nav-links">
                <li>
                    <a href="/pdv" class="{% if request.url.path == '/pdv' %}active{% endif %}">
                        <i data-lucide="shopping-cart"></i>
                        <span class="link-text">POS (PDV)</span>
                    </a>
                </li>
                <li>
                    <a href="/produtos" class="{% if request.url.path == '/produtos' %}active{% endif %}">
                        <i data-lucide="package"></i>
                        <span class="link-text">Products</span>
                    </a>
                </li>
                <li>
                    <a href="/movimentacoes" class="{% if request.url.path == '/movimentacoes' %}active{% endif %}">
                        <i data-lucide="arrow-left-right"></i>
                        <span class="link-text">Transactions</span>
                    </a>
                </li>
                <li>
                    <a href="/categorias" class="{% if request.url.path == '/categorias' %}active{% endif %}">
                        <i data-lucide="grid"></i>
                        <span class="link-text">Categories</span>
                    </a>
                </li>
                <li>
                    <a href="/usuarios" class="{% if request.url.path == '/usuarios' %}active{% endif %}">
                        <i data-lucide="users"></i>
                        <span class="link-text">Users</span>
                    </a>
                </li>
                <li>
                    <a href="/clientes" class="{% if request.url.path == '/clientes' %}active{% endif %}">
                        <i data-lucide="user-check"></i>
                        <span class="link-text">Clients</span>
                    </a>
                </li>
                <li>
                    <a href="/armarios" class="{% if request.url.path == '/armarios' %}active{% endif %}">
                        <i data-lucide="archive"></i>
                        <span class="link-text">Lockers</span>
                    </a>
                </li>
            </ul>
        </div>

        <!-- Links Inferiores (Logout) -->
        <div>
            <div class="menu-divider"></div>
            <ul class="nav-links">
                <li>
                    <a href="/auth/logout" class="btn-logout">
                        <i data-lucide="log-out"></i>
                        <span class="link-text">Logout</span>
                    </a>
                </li>
            </ul>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-container">
        {% if erro %}
            <div class="msg-alert msg-erro">{{ erro }}</div>
        {% endif %}

        {% block content %}
            <!-- Conteúdo do PDV ou outras telas aqui -->
        {% block content %}{% endblock %}
        {% endblock %}
    </main>

    <script>
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggleBtn');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });

        // Inicializar os ícones Lucide
        lucide.createIcons();
    </script>
</body>
</html>
