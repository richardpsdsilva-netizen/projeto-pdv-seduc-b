<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AAPM System{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #2554d7;
            position: relative;
            overflow-x: hidden;
            color: #ffffff;
            display: flex;
            padding: 20px;
        }

        /* --- BACKGROUND WAVES ANIMATION --- */
        .background-waves {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .wave {
            transform-origin: center;
            will-change: transform;
        }

        .wave-left-outer {
            animation: moveCircleLeftSmooth 8s ease-in-out infinite alternate;
        }

        .wave-left-inner {
            animation: moveCircleLeftSmooth 10s ease-in-out infinite alternate-reverse;
        }

        .wave-right {
            animation: moveWaveRightSmooth 9s ease-in-out infinite alternate;
        }

        @keyframes moveCircleLeftSmooth {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(45px, -30px) scale(1.08) rotate(3.5deg); }
            100% { transform: translate(-30px, 35px) scale(0.94) rotate(-2.5deg); }
        }

        @keyframes moveWaveRightSmooth {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(-50px, 30px) scale(1.06) rotate(-3.5deg); }
            100% { transform: translate(35px, -35px) scale(0.95) rotate(2deg); }
        }

        /* --- SIDEBAR MACOS STYLE --- */
        .sidebar {
            position: fixed;
            top: 20px;
            left: 20px;
            bottom: 20px;
            width: 250px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Estado Retraído */
        .sidebar.collapsed {
            width: 78px;
        }

        /* Topo da Sidebar (Bolinhas do Mac + Título) */
        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding: 0 6px;
        }

        .mac-dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot-close { background-color: #ff5f56; }
        .dot-minimize { background-color: #ffbd2e; }
        .dot-expand { background-color: #27c93f; }

        .brand-title {
            color: #1d1d1f;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-decoration: none;
            transition: opacity 0.3s;
            white-space: nowrap;
        }

        .sidebar.collapsed .brand-title {
            opacity: 0;
            display: none;
        }

        /* Botão de Retrair Circular com Animação */
        .btn-toggle {
            background: #e5e5ea;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .btn-toggle:hover {
            background: #d1d1d6;
        }

        .btn-toggle svg {
            width: 14px;
            height: 14px;
            stroke: #1d1d1f;
            stroke-width: 2.5;
            fill: none;
            transition: transform 0.5s ease-in-out;
        }

        .sidebar.collapsed .btn-toggle {
            transform: rotate(360deg);
        }

        .sidebar.collapsed .btn-toggle svg {
            transform: rotate(180deg);
        }

        /* Seção "MAIN" */
        .section-label {
            font-size: 10px;
            font-weight: 700;
            color: #8e8e93;
            letter-spacing: 1px;
            margin: 10px 10px 8px 10px;
            text-transform: uppercase;
            transition: opacity 0.2s;
        }

        .sidebar.collapsed .section-label {
            opacity: 0;
            display: none;
        }

        /* Lista de Links */
        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-links a {
            color: #48484a;
            background-color: #f2f2f7;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: 12px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            white-space: nowrap;
        }

        .nav-links a:hover {
            background-color: #e5e5ea;
            color: #000000;
        }

        /* Estado Clicado / Ativo (Fica Azul) */
        .nav-links a:active,
        .nav-links a.active {
            background-color: #2554d7;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 84, 215, 0.3);
        }

        /* Modos Recolhidos */
        .sidebar.collapsed .nav-links a {
            padding: 12px;
            justify-content: center;
        }

        .sidebar.collapsed .link-text {
            display: none;
        }

        .link-short {
            display: none;
            font-weight: 700;
            font-size: 11px;
        }

        .sidebar.collapsed .link-short {
            display: inline;
        }

        /* Botão Logout em Destaque */
        .btn-logout {
            background-color: #ffe5e5 !important;
            color: #ff3b30 !important;
        }

        .btn-logout:hover {
            background-color: #ffd1d1 !important;
        }

        .btn-logout:active {
            background-color: #ff3b30 !important;
            color: #ffffff !important;
        }

        /* --- CONTEÚDO PRINCIPAL --- */
        .main-container {
            position: relative;
            z-index: 2;
            flex-grow: 1;
            padding: 20px 30px;
            margin-left: 270px;
            width: calc(100% - 270px);
            transition: margin-left 0.4s cubic-bezier(0.16, 1, 0.3, 1), width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sidebar.collapsed ~ .main-container {
            margin-left: 98px;
            width: calc(100% - 98px);
        }

        /* Messages */
        .msg-alert {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 12px;
            font-size: 12px;
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .msg-erro {
            color: #ffffff;
            background: rgba(255, 59, 48, 0.4);
        }
    </style>
</head>
<body>

    <!-- Background Waves Animation -->
    <svg class="background-waves" preserveAspectRatio="none" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
        <circle class="wave wave-left-outer" cx="-100" cy="1100" r="750" fill="rgba(255, 255, 255, 0.06)" />
        <circle class="wave wave-left-inner" cx="-100" cy="1100" r="520" fill="rgba(255, 255, 255, 0.08)" />
        <path class="wave wave-right" d="M 350 -100 C 650 150, 980 350, 780 700 C 620 980, 720 1080, 1100 1100 L 1100 -100 Z" fill="rgba(255, 255, 255, 0.07)" />
    </svg>

    <!-- Sidebar macOS Style -->
    <aside class="sidebar" id="sidebar">
        <div>
            <!-- Header com Bolinhas Mac e Botão Toggle -->
            <div class="sidebar-header">
                <div class="mac-dots">
                    <div class="dot dot-close"></div>
                    <div class="dot dot-minimize"></div>
                    <div class="dot dot-expand"></div>
                </div>
                <a href="/" class="brand-title">AAPM SYSTEM</a>
                <button class="btn-toggle" id="toggleBtn" title="Toggle Sidebar">
                    <svg viewBox="0 0 24 24">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
            </div>

            <div class="section-label">MAIN</div>

            <ul class="nav-links">
                <li>
                    <a href="/pdv" class="{% if request.url.path == '/pdv' %}active{% endif %}">
                        <span class="link-text">POS (PDV)</span>
                        <span class="link-short">PDV</span>
                    </a>
                </li>
                <li>
                    <a href="/produtos" class="{% if request.url.path == '/produtos' %}active{% endif %}">
                        <span class="link-text">Products</span>
                        <span class="link-short">PRD</span>
                    </a>
                </li>
                <li>
                    <a href="/movimentacoes" class="{% if request.url.path == '/movimentacoes' %}active{% endif %}">
                        <span class="link-text">Transactions</span>
                        <span class="link-short">TRX</span>
                    </a>
                </li>
                <li>
                    <a href="/categorias" class="{% if request.url.path == '/categorias' %}active{% endif %}">
                        <span class="link-text">Categories</span>
                        <span class="link-short">CAT</span>
                    </a>
                </li>
                <li>
                    <a href="/usuarios" class="{% if request.url.path == '/usuarios' %}active{% endif %}">
                        <span class="link-text">Users</span>
                        <span class="link-short">USR</span>
                    </a>
                </li>
                <li>
                    <a href="/clientes" class="{% if request.url.path == '/clientes' %}active{% endif %}">
                        <span class="link-text">Clients</span>
                        <span class="link-short">CLI</span>
                    </a>
                </li>
                <li>
                    <a href="/armarios" class="{% if request.url.path == '/armarios' %}active{% endif %}">
                        <span class="link-text">Lockers</span>
                        <span class="link-short">LCK</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="nav-links">
            <a href="/auth/logout" class="btn-logout">
                <span class="link-text">Logout</span>
                <span class="link-short">OFF</span>
            </a>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-container">
        {% if erro %}
            <div class="msg-alert msg-erro">{{ erro }}</div>
        {% endif %}

        {% block content %}
            <!-- Conteúdo injetado aqui -->
        {% endblock %}
    </main>

    <script>
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggleBtn');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });
    </script>
</body>
</html>
