<!-- templates/produtos/form.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ "Editar" if editando else "Novo" }} Produto — AAPM SENAI</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-red-50/50 min-h-screen flex flex-col items-center justify-center p-4 font-sans text-slate-800">

    <main class="w-full max-w-lg bg-white rounded-2xl shadow-xl border border-red-100 p-8 space-y-6 my-8">
        
        <!-- Cabeçalho -->
        <div class="text-center space-y-2">
            <div class="px-3.5 py-1.5 bg-red-600 text-white font-bold text-sm rounded-xl shadow-md tracking-wider inline-flex items-center justify-center mb-1">
                AAPM
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">
                {{ "Editar produto" if editando else "Novo produto" }}
            </h1>
            <p class="text-sm text-slate-500">
                {{ "Atualize as informações do item" if editando else "Preencha os dados para cadastrar um item" }}
            </p>
        </div>

        <!-- Mensagem de Erro -->
        {% if erro %}
            <div class="p-3.5 bg-red-50 border border-red-200 text-red-700 text-sm font-medium rounded-xl text-center">
                {{ erro }}
            </div>
        {% endif %}

        <!-- Formulário -->
        <form action="{{ '/produtos/' + editando.id|string + '/editar' if editando else '/produtos/novo' }}"
              method="post"
              enctype="multipart/form-data"
              class="space-y-4">

            <!-- Nome do Produto -->
            <div>
                <label for="nome" class="block text-sm font-semibold text-slate-700 mb-1">Nome</label>
                <input type="text"
                       name="nome"
                       id="nome"
                       value="{{ editando.nome if editando else (valores.nome if valores else '') }}"
                       required
                       placeholder="Ex: Camiseta SENAI"
                       class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-600 transition-all text-sm">
            </div>

            <!-- Preço e Estoque em Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="preco" class="block text-sm font-semibold text-slate-700 mb-1">Preço (R$)</label>
                    <input type="number"
                           name="preco"
                           id="preco"
                           step="0.01"
                           min="0"
                           value="{{ editando.preco if editando else (valores.preco if valores else '0.00') }}"
                           required
                           placeholder="0.00"
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-600 transition-all text-sm">
                </div>

                <div>
                    <label for="estoque_atual" class="block text-sm font-semibold text-slate-700 mb-1">Estoque atual</label>
                    <input type="number"
                           name="estoque_atual"
                           id="estoque_atual"
                           min="0"
                           value="{{ editando.estoque_atual if editando else (valores.estoque_atual if valores else '0') }}"
                           required
                           placeholder="0"
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-600 transition-all text-sm">
                </div>
            </div>

            <!-- Categoria -->
            <div>
                <label for="categoria_id" class="block text-sm font-semibold text-slate-700 mb-1">Categoria</label>
                <select name="categoria_id"
                        id="categoria_id"
                        class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-600 transition-all text-sm">
                    <option value="0">Sem categoria</option>
                    {% for c in categorias %}
                        <option value="{{ c.id }}"
                            {{ 'selected' if (editando and editando.categoria_id == c.id) or (valores and valores.categoria_id == c.id) else '' }}>
                            {{ c.nome }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Imagem Atual (Se estiver editando) -->
            {% if editando and editando.imagem_path %}
                <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                    <span class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">Imagem atual:</span>
                    <div class="w-20 h-20 bg-white rounded-lg overflow-hidden border border-slate-200">
                        <img src="{{ editando.imagem_url }}"
                             alt="{{ editando.nome }}"
                             class="w-full h-full object-cover">
                    </div>
                </div>
            {% endif %}

            <!-- Upload de Nova Imagem -->
            <div>
                <label for="imagem" class="block text-sm font-semibold text-slate-700 mb-1">
                    {{ "Nova imagem (deixe vazio para manter a atual):" if editando else "Imagem do produto" }}
                </label>
                <input type="file"
                       name="imagem"
                       id="imagem"
                       accept=".jpg,.jpeg,.png,.webp"
                       class="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100 transition-all border border-slate-200 rounded-xl cursor-pointer bg-slate-50">
            </div>

            <!-- Ações -->
            <div class="pt-2 flex items-center gap-3">
                <button type="submit"
                        class="flex-1 py-3 px-4 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all duration-200 text-sm">
                    {{ "Salvar alterações" if editando else "Criar produto" }}
                </button>
                <a href="/produtos"
                   class="px-5 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl transition-all duration-200 text-sm text-center">
                    Cancelar
                </a>
            </div>

        </form>

    </main>

</body>
</html>
