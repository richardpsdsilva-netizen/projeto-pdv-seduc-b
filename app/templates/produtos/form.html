<!-- templates/produtos/form.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ "Editar" if editando else "Novo" }} Produto — AAPM SENAI</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Container do Fundo Animado */
        .cubes-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0; /* Fica no fundo */
            margin: 0;
            padding: 0;
        }

        /* Estilo base de cada cubo */
        .cubes-bg li {
            position: absolute;
            list-style: none;
            display: block;
            width: 20px;
            height: 20px;
            background: rgba(220, 38, 38, 0.12); /* Vermelho translúcido */
            border: 1px solid rgba(220, 38, 38, 0.25);
            border-radius: 12px; /* Cantos arredondados */
            bottom: -150px;
            animation: moveCubes 22s infinite ease-in-out;
        }

        /* Animação CSS: Subindo, girando e descendo */
        @keyframes moveCubes {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            50% {
                transform: translateY(-50vh) rotate(180deg);
            }
            70% {
                transform: translateY(-35vh) rotate(240deg);
            }
            100% {
                transform: translateY(-105vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Distribuição dos 16 cubos com posições e tempos variados */
        .cubes-bg li:nth-child(1)  { left: 25%; width: 80px; height: 80px; animation-delay: -2s;  animation-duration: 26s; }
        .cubes-bg li:nth-child(2)  { left: 10%; width: 30px; height: 30px; animation-delay: -7s;  animation-duration: 20s; }
        .cubes-bg li:nth-child(3)  { left: 70%; width: 45px; height: 45px; animation-delay: -12s; animation-duration: 22s; }
        .cubes-bg li:nth-child(4)  { left: 40%; width: 60px; height: 60px; animation-delay: -5s;  animation-duration: 30s; }
        .cubes-bg li:nth-child(5)  { left: 65%; width: 25px; height: 25px; animation-delay: -15s; animation-duration: 18s; }
        .cubes-bg li:nth-child(6)  { left: 85%; width: 90px; height: 90px; animation-delay: -8s;  animation-duration: 28s; }
        .cubes-bg li:nth-child(7)  { left: 55%; width: 50px; height: 50px; animation-delay: -18s; animation-duration: 24s; }
        .cubes-bg li:nth-child(8)  { left: 15%; width: 20px; height: 20px; animation-delay: -3s;  animation-duration: 21s; }
        .cubes-bg li:nth-child(9)  { left: 3%;  width: 40px; height: 40px; animation-delay: -10s; animation-duration: 32s; }
        .cubes-bg li:nth-child(10) { left: 92%; width: 70px; height: 70px; animation-delay: -14s; animation-duration: 25s; }
        .cubes-bg li:nth-child(11) { left: 32%; width: 35px; height: 35px; animation-delay: -9s;  animation-duration: 23s; }
        .cubes-bg li:nth-child(12) { left: 48%; width: 75px; height: 75px; animation-delay: -16s; animation-duration: 27s; }
        .cubes-bg li:nth-child(13) { left: 78%; width: 20px; height: 20px; animation-delay: -4s;  animation-duration: 19s; }
        .cubes-bg li:nth-child(14) { left: 20%; width: 55px; height: 55px; animation-delay: -11s; animation-duration: 29s; }
        .cubes-bg li:nth-child(15) { left: 80%; width: 40px; height: 40px; animation-delay: -1s;  animation-duration: 21s; }
        .cubes-bg li:nth-child(16) { left: 60%; width: 30px; height: 30px; animation-delay: -13s; animation-duration: 25s; }
    </style>
</head>
<body class="bg-red-50/40 min-h-screen flex flex-col items-center justify-center p-4 font-sans text-slate-800 relative">

    <!-- Fundo Animado com 16 Cubos -->
    <ul class="cubes-bg">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>

    <!-- Container do Formulário -->
    <main class="w-full max-w-lg bg-white/95 backdrop-blur-md rounded-2xl shadow-xl border border-red-100/80 p-8 space-y-6 my-8 z-10">
        
        <!-- Cabeçalho -->
        <div class="text-center space-y-2">
            <div class="px-3.5 py-1.5 bg-red-600 text-white font-bold text-sm rounded-xl shadow-md tracking-wider inline-flex items-center justify-center mb-1 transform transition-transform duration-300 hover:scale-105">
                AAPM
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">
                {{ "Editar produto" if editando else "Novo produto" }}
            </h1>
            <p class="text-sm text-slate-500">
                {{ "Atualize as informações do item" if editando else "Preencha os dados para cadastrar um item" }}
            </p>
        </div>

        <!-- Mensagem de Erro -->
        {% if erro %}
            <div class="p-3.5 bg-red-50/90 backdrop-blur-md border border-red-200 text-red-700 text-sm font-medium rounded-xl text-center shadow-sm">
                {{ erro }}
            </div>
        {% endif %}

        <!-- Formulário -->
        <form action="{{ '/produtos/' + editando.id|string + '/editar' if editando else '/produtos/novo' }}"
              method="post"
              enctype="multipart/form-data"
              class="space-y-4">

            <!-- Nome do Produto -->
            <div>
                <label for="nome" class="block text-sm font-semibold text-slate-700 mb-1">Nome</label>
                <input type="text"
                       name="nome"
                       id="nome"
                       value="{{ editando.nome if editando else (valores.nome if valores else '') }}"
                       required
                       placeholder="Ex: Camiseta SENAI"
                       class="w-full px-4 py-2.5 bg-slate-50/80 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-600 transition-all text-sm">
            </div>

            <!-- Preço e Estoque em Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="preco" class="block text-sm font-semibold text-slate-700 mb-1">Preço (R$)</label>
                    <input type="number"
                           name="preco"
                           id="preco"
                           step="0.01"
                           min="0"
                           value="{{ editando.preco if editando else (valores.preco if valores else '0.00') }}"
                           required
                           placeholder="0.00"
                           class="w-full px-4 py-2.5 bg-slate-50/80 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-600 transition-all text-sm">
                </div>

                <div>
                    <label for="estoque_atual" class="block text-sm font-semibold text-slate-700 mb-1">Estoque atual</label>
                    <input type="number"
                           name="estoque_atual"
                           id="estoque_atual"
                           min="0"
                           value="{{ editando.estoque_atual if editando else (valores.estoque_atual if valores else '0') }}"
                           required
                           placeholder="0"
                           class="w-full px-4 py-2.5 bg-slate-50/80 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-600 transition-all text-sm">
                </div>
            </div>

            <!-- Categoria -->
            <div>
                <label for="categoria_id" class="block text-sm font-semibold text-slate-700 mb-1">Categoria</label>
                <select name="categoria_id"
                        id="categoria_id"
                        class="w-full px-4 py-2.5 bg-slate-50/80 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-600 transition-all text-sm">
                    <option value="0">Sem categoria</option>
                    {% for c in categorias %}
                        <option value="{{ c.id }}"
                            {{ 'selected' if (editando and editando.categoria_id == c.id) or (valores and valores.categoria_id == c.id) else '' }}>
                            {{ c.nome }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Imagem Atual (Se estiver editando) -->
            {% if editando and editando.imagem_path %}
                <div class="p-3 bg-slate-50/80 border border-slate-200 rounded-xl space-y-2">
                    <span class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">Imagem atual:</span>
                    <div class="w-20 h-20 bg-white rounded-lg overflow-hidden border border-slate-200">
                        <img src="{{ editando.imagem_url }}"
                             alt="{{ editando.nome }}"
                             class="w-full h-full object-cover">
                    </div>
                </div>
            {% endif %}

            <!-- Upload de Nova Imagem -->
            <div>
                <label for="imagem" class="block text-sm font-semibold text-slate-700 mb-1">
                    {{ "Nova imagem (deixe vazio para manter a atual):" if editando else "Imagem do produto" }}
                </label>
                <input type="file"
                       name="imagem"
                       id="imagem"
                       accept=".jpg,.jpeg,.png,.webp"
                       class="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100 transition-all border border-slate-200 rounded-xl cursor-pointer bg-slate-50/80">
            </div>

            <!-- Ações -->
            <div class="pt-2 flex items-center gap-3">
                <button type="submit"
                        class="flex-1 py-3 px-4 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all duration-200 text-sm hover:-translate-y-0.5">
                    {{ "Salvar alterações" if editando else "Criar produto" }}
                </button>
                <a href="/produtos"
                   class="px-5 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl transition-all duration-200 text-sm text-center">
                    Cancelar
                </a>
            </div>

        </form>

    </main>

</body>
</html>
